<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Offline — PhonesDaddy</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --primary: #0d9488;
      --primary-hover: #0f766e;
      --primary-light: rgba(13, 148, 136, 0.12);
      --dark-bg: #0f172a;
      --card-bg: #1e293b;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
      --border-line: rgba(255, 255, 255, 0.08);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(13, 148, 136, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
      color: var(--text-white);
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .brand-title span {
      color: #14b8a6;
    }
    .illustration-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--primary-light);
    }
    .pulse-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px dashed rgba(20, 184, 166, 0.35);
      animation: rotateRing 16s linear infinite;
    }
    @keyframes rotateRing {
      to { transform: rotate(360deg); }
    }
    .illustration-icon {
      width: 54px;
      height: 54px;
      color: #2dd4bf;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #fff;
    }
    p.desc {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 28px;
    }
    .actions-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.4);
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      background: linear-gradient(135deg, #0f766e, #0d9488);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(13, 148, 136, 0.5);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
    .btn-retry.checking {
      opacity: 0.75;
      pointer-events: none;
    }
    .btn-retry.checking svg {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .quick-links-section {
      border-top: 1px solid var(--border-line);
      padding-top: 20px;
    }
    .quick-links-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 14px;
      font-weight: 600;
    }
    .quick-links-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .quick-link-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-line);
      color: var(--text-white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 10px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }
    .quick-link-chip:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(20, 184, 166, 0.4);
      color: #2dd4bf;
    }
    .status-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #10b981;
      color: #fff;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    .status-toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="offline-card">
    <a href="/" class="brand-header">
      <div class="brand-icon">P</div>
      <div class="brand-title">Phones<span>Daddy</span></div>
    </a>

    <div class="illustration-wrapper">
      <div class="pulse-ring"></div>
      <svg class="illustration-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <h1>You Are Offline</h1>
    <p class="desc">
      It looks like your internet connection was interrupted. Check your Wi-Fi or mobile data network and try again.
    </p>

    <div class="actions-group">
      <button class="btn-retry" id="btnRetry">
        <svg id="retryIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span id="retryText">Check Connection & Retry</span>
      </button>
    </div>

    <div class="quick-links-section">
      <div class="quick-links-label">Saved Offline Pages</div>
      <div class="quick-links-grid">
        <a href="/" class="quick-link-chip">
          <span>🏠</span> Home
        </a>
        <a href="/phones" class="quick-link-chip">
          <span>📱</span> Mobiles
        </a>
        <a href="/compare" class="quick-link-chip">
          <span>⚖️</span> Compare
        </a>
        <a href="/pta-tax-calculator" class="quick-link-chip">
          <span>🇵🇰</span> PTA Tax
        </a>
      </div>
    </div>
  </div>

  <div class="status-toast" id="onlineToast">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span>Internet Restored! Reconnecting...</span>
  </div>

  <script>
    const btnRetry = document.getElementById('btnRetry');
    const retryIcon = document.getElementById('retryIcon');
    const retryText = document.getElementById('retryText');
    const onlineToast = document.getElementById('onlineToast');

    function checkConnection() {
      btnRetry.classList.add('checking');
      retryText.textContent = 'Checking network...';

      fetch('/api/health?t=' + Date.now(), { method: 'GET', cache: 'no-store' })
        .then(function(res) {
          if (res.ok) {
            handleOnlineRestored();
          } else {
            showStillOffline();
          }
        })
        .catch(function() {
          showStillOffline();
        });
    }

    function showStillOffline() {
      setTimeout(function() {
        btnRetry.classList.remove('checking');
        retryText.textContent = 'Still Offline — Tap to Retry';
      }, 700);
    }

    function handleOnlineRestored() {
      onlineToast.classList.add('visible');
      setTimeout(function() {
        // Return to previous URL or home
        var prevUrl = document.referrer;
        if (prevUrl && !prevUrl.includes('offline')) {
          window.location.href = prevUrl;
        } else {
          window.location.href = '/';
        }
      }, 1200);
    }

    btnRetry.addEventListener('click', checkConnection);

    window.addEventListener('online', function() {
      handleOnlineRestored();
    });
  </script>
</body>
</html>
