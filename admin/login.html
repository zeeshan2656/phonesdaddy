<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — PhonesDaddy</title>
  <link rel="stylesheet" href="/css/admin.css?v=2026.5">
  <style>
    /* ==========================================================================
       PhonesDaddy Admin Login - Self-Contained Resilient Styling
       Guarantees 100% flawless presentation across any caching / SW state
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b1120;
      background-image: 
        radial-gradient(at 50% 0%, rgba(13, 148, 136, 0.18) 0px, transparent 65%),
        radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.8) 0px, transparent 50%);
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-login-wrapper {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .admin-login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 
        0 10px 15px -3px rgba(0, 0, 0, 0.2),
        0 25px 35px -5px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      animation: cardAppear 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-icon {
      margin: 0 auto 14px;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px -5px rgba(13, 148, 136, 0.45);
      letter-spacing: -0.03em;
    }

    .admin-login-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .admin-login-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: 5px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 7px;
    }

    .form-control {
      width: 100%;
      height: 44px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      transition: all 0.15s ease-in-out;
      outline: none;
    }

    .form-control:focus {
      background: #ffffff;
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      border-radius: 8px;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.28);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
      box-shadow: 0 6px 18px rgba(13, 148, 136, 0.38);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.25);
    }

    .btn-block {
      width: 100%;
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: #0d9488;
    }

    .alert-error {
      padding: 11px 15px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: alertShake 0.3s ease;
    }

    @keyframes alertShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  </style>
</head>

<body>

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div style="text-align: center; margin-bottom: 26px;">
        <div class="brand-icon">P</div>
        <div class="admin-login-title">Phones<span style="color: #0d9488;">Daddy</span></div>
        <div class="admin-login-subtitle">Management Administration Portal</div>
      </div>

      <div id="loginAlert" class="alert-error"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminUsername">Username</label>
          <input type="text" id="adminUsername" name="username" class="form-control" placeholder="Enter admin username"
            required autocomplete="username">
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" class="form-control" placeholder="Enter password"
            required autocomplete="current-password">
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="height: 46px; font-size: 15px;">
          Sign In to Dashboard
        </button>
      </form>

      <div style="text-align: center;">
        <a href="/" class="back-link">&larr; Back to Public Website</a>
      </div>
    </div>
  </div>

  <script>
    // Direct submit handler ensures login works under all network/SW conditions
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('adminLoginForm');
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('loginSubmitBtn');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (alertBox) alertBox.style.display = 'none';

        const username = form.username.value.trim();
        const password = form.password.value;

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = 'Authenticating...';
        }

        try {
          const res = await fetch('/api/admin/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (data && data.success) {
            if (submitBtn) submitBtn.innerHTML = 'Success! Redirecting...';
            window.location.href = '/admin/dashboard';
          } else {
            if (alertBox) {
              alertBox.innerText = (data && data.message) ? data.message : 'Invalid username or password';
              alertBox.style.display = 'block';
            }
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = 'Sign In to Dashboard';
            }
          }
        } catch (err) {
          console.error('[Admin Login] Network or server error:', err);
          if (alertBox) {
            alertBox.innerText = 'Unable to connect to the authentication server. Please verify your connection.';
            alertBox.style.display = 'block';
          }
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Sign In to Dashboard';
          }
        }
      });
    });
  </script>

  <script src="/js/icons.js"></script>
  <script src="/js/admin.js"></script>
</body>

</html>
