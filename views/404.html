<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | {{SITE_NAME}}</title>
  {{SITE_FAVICON_TAG}}
  <link rel="stylesheet" href="/css/style.min.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand-logo">
        {{SITE_LOGO_HTML}}
      </a>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/phones" class="nav-link">Mobiles</a></li>
          <li><a href="/brands" class="nav-link">Brands</a></li>
          <li><a href="/admin/login" class="nav-link nav-login-btn"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Login</a></li>
        </ul>
      </nav>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Menu"><svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg></button>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px 20px;">
    <div style="max-width: 500px;">
      <div style="font-size: 5rem; font-weight: 900; color: #0d9488; line-height: 1; margin-bottom: 12px;">404</div>
      <h1 style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 12px;">Page Not Found</h1>
      <p style="color: #64748b; font-size: 15px; margin-bottom: 28px; line-height: 1.5;">
        The smartphone, brand, or page you are looking for does not exist, has been renamed, or is temporarily unavailable.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center;">
        <a href="/" class="btn btn-primary">Back to Homepage</a>
        <a href="/phones" class="btn btn-outline">Explore Phones</a>
      </div>
    </div>
  </main>

  <footer class="footer-bottom" style="margin-top: auto; background: var(--dark); color: #94a3b8;">
    <div class="container">
      {{FOOTER_COPYRIGHT}}
    </div>
  </footer>

  
  <script defer src="/js/app.min.js"></script>
  {{WHATSAPP_BUTTON_HTML}}
</body>
</html>
